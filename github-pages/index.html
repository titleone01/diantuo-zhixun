<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="面向职业院校的电气控制虚拟接线与实训教学平台" />
    <title>电气控制实训仿真系统</title>
    <link rel="stylesheet" href="__APP_BASE__sim-assets/startup.css" />
  </head>
  <body>
    <div id="root"><main id="dt-startup" class="dt-startup" aria-live="polite">
      <h1 data-startup-title>正在打开实训工作台…</h1>
      <p data-startup-message>请稍候。首次加载可能需要一点时间。</p>
      <div data-startup-actions hidden><button type="button" data-startup-reload>重新加载</button><a href="https://www.microsoft.com/zh-cn/edge/download" target="_blank" rel="noopener noreferrer">下载新版 Microsoft Edge</a></div>
      <p><code data-startup-code></code></p>
      <noscript>浏览器未启用 JavaScript，无法运行实训工作台。请启用 JavaScript，或使用新版 Microsoft Edge / Chrome。</noscript>
    </main></div>
    <script src="__APP_BASE__sim-assets/startup.js"></script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
