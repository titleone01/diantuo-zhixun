name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:extended
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sanitized-acceptance
          path: .local/acceptance-public/
          if-no-files-found: ignore
          retention-days: 14
          # Never upload temp Worker state, .dev.vars, sessions, traces or test credentials.
